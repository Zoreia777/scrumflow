[project]
name = "scrumflow-backend"
version = "0.1.0"
description = "API do ScrumFlow (FastAPI + SQLAlchemy + PostgreSQL)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = [
    "integration: exige PostgreSQL em execução (docker compose up -d db)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# A pasta local "alembic/" (migrações) não deve ser confundida com a biblioteca.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Migrações geradas pelo Alembic podem importar módulos que ainda não usam.
"alembic/versions/*" = ["F401"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests", "alembic"]
